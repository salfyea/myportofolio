name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same branch so pushes do not queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Dummy values: the suite uses SQLite and never calls external services.
      SECRET_KEY: ci-only-not-a-real-secret
      PRODUCTION: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Ensure no model change is missing a migration
        run: python manage.py makemigrations --check --dry-run

      # Chrome is preinstalled on ubuntu-latest, so the Selenium tests run here too.
      # Both apps are listed because "test main" alone would skip the contacts tests.
      - name: Run tests with coverage
        run: python -m coverage run manage.py test main contacts

      - name: Enforce 90 percent coverage
        run: python -m coverage report --fail-under=90
