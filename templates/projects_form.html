{% extends "base.html" %}

{% block title %}Add Project - {{ name }}{% endblock %}

{% block content %}
<section class="projects-section">
    <div class="container">
        <h1 class="section-title">Add New Project</h1>

        <form
            method="post"
            action="{% url 'main:create_project' %}"
            class="project-form"
        >
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" class="button">
                    Tambah Project
                </button>

                <a
                    href="{% url 'main:show_projects' %}"
                    class="button button-secondary"
                >
                    Batal
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
