<button
    type="button"
    class="button button-danger"
    popovertarget="delete-skill-{{ skill.id }}"
>
    Hapus
</button>

<div
    id="delete-skill-{{ skill.id }}"
    class="delete-modal"
    popover="auto"
>
    <button
        type="button"
        class="delete-modal__backdrop"
        popovertarget="delete-skill-{{ skill.id }}"
        popovertargetaction="hide"
        aria-label="Tutup"
    ></button>

    <div class="delete-modal__content">
        <h2>Hapus Skill?</h2>

        <p>
            Apakah kamu yakin ingin menghapus
            <strong>{{ skill.name }}</strong>?
        </p>

        <form
            method="post"
            action="{% url 'main:delete_skill' skill.id %}"
        >
            {% csrf_token %}

            <div class="form-group">
                <label for="delete-skill-secret-{{ skill.id }}">
                    Kode Rahasia
                </label>
                <input
                    type="password"
                    id="delete-skill-secret-{{ skill.id }}"
                    name="secret_key"
                    placeholder="Masukkan kode rahasia"
                    required
                >
            </div>

            <div class="delete-modal__actions">
                <button
                    type="button"
                    class="button button-secondary"
                    popovertarget="delete-skill-{{ skill.id }}"
                    popovertargetaction="hide"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="button button-danger"
                >
                    Ya, Hapus
                </button>
            </div>
        </form>
    </div>
</div>
