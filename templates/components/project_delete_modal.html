<button
    type="button"
    class="button button-danger"
    popovertarget="delete-project-{{ project.id }}"
>
    Hapus
</button>

<div
    id="delete-project-{{ project.id }}"
    class="delete-modal"
    popover="auto"
>
    <button
        type="button"
        class="delete-modal__backdrop"
        popovertarget="delete-project-{{ project.id }}"
        popovertargetaction="hide"
        aria-label="Tutup"
    ></button>

    <div class="delete-modal__content">
        <h2>Hapus Project?</h2>

        <p>
            Apakah kamu yakin ingin menghapus
            <strong>{{ project.title }}</strong>?
        </p>

        <form
            method="post"
            action="{% url 'main:delete_project' project.id %}"
        >
            {% csrf_token %}

            <div class="delete-modal__actions">
                <button
                    type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="button button-danger"
                >
                    Ya, Hapus
                </button>
            </div>
        </form>
    </div>
</div>
