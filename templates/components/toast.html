{% load static %}
<div
    id="toast-component"
    class="toast toast-normal"
    popover="manual"
    role="status"
    aria-live="polite"
>
    <p id="toast-title" class="toast__title"></p>
    <p id="toast-message" class="toast__message"></p>
</div>

<script src="{% static 'js/toast.js' %}"></script>
